name: Build and push VirusTotal domain monitor container image to the local container image repository

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - "vt_domain_monitor.py"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "vt_domain_monitor.py"
  workflow_dispatch: {} # allows manual trigger

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: satrd-iot/vt-domain-monitor

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push the container image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}